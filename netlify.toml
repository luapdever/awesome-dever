# Node 22 : exigé par les Agent Runners de Netlify, et sharp 0.35 (blur
# placeholders de next/image) réclame au minimum 20.9.
# ⚠ Une variable NODE_VERSION définie dans l'UI Netlify ÉCRASE ce fichier.
# La commande de build et le dossier de publication restent définis dans l'UI.
[build.environment]
  NODE_VERSION = "22"

# Redirection 301 de l'ancien sous-domaine vers le domaine définitif.
[[redirects]]
  from = "https://luap-dever.netlify.app/*"
  to = "https://paulzannou.com/:splat"
  status = 301
  force = true
